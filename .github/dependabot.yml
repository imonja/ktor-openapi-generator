version: 2

# Minor and patch updates arrive as one grouped PR per ecosystem; major updates get their own PRs.
# All are merged manually; the commented-out dependabot-automerge job in pr.yml can auto-merge minor/patch.
# Commit messages carry no (BUMP)/(MINOR) marker, so merged updates ship with the next manual release.
updates:
    # The root build includes gradle-plugin (includeBuild), so "/" covers both builds;
    # listing "/gradle-plugin" separately opens duplicate PRs.
    -   package-ecosystem: gradle
        directory: "/"
        schedule:
            interval: weekly
            day: monday
        groups:
            gradle-minor-patch:
                update-types:
                    - minor
                    - patch

    # "/" covers .github/workflows; composite actions under .github/actions are listed separately
    -   package-ecosystem: github-actions
        directories:
            - "/"
            - "/.github/actions/*"
        schedule:
            interval: weekly
            day: monday
        groups:
            actions-minor-patch:
                update-types:
                    - minor
                    - patch
