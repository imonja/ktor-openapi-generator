name: Publish SNAPSHOT

# Manual run on the selected branch: publishes <next version>-<branch>-SNAPSHOT of the library and the Gradle plugin
# to Maven Central snapshots (https://central.sonatype.com/repository/maven-snapshots/) and GitHub Packages.
on:
    workflow_dispatch:

jobs:
    publish-snapshot:
        runs-on: ubuntu-latest
        concurrency: publish-snapshot-${{ github.ref_name }}
        permissions:
            packages: write
            contents: read
            checks: write
        name: Build & Test & Publish SNAPSHOT

        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   uses: ./.github/actions/build-and-test

            -   uses: paulhatch/semantic-version@v6.0.4
                id: tag
                with:
                    bump_each_commit: true
                    # Release markers count only at the start of the commit subject, e.g. "(BUMP) - fix(...): ...",
                    # so a marker mentioned elsewhere in a message does not trigger a release
                    bump_each_commit_patch_pattern: "/^\\(BUMP\\) - /"
                    major_pattern: "/^\\(MAJOR\\) - /"
                    minor_pattern: "/^\\(MINOR\\) - /"
                    tag_prefix: ""

            -   name: Get version
                id: version
                run: |
                    branch=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.]+/-/g; s/^-+|-+$//g')
                    version="${{ steps.tag.outputs.version }}-${branch}-SNAPSHOT"
                    echo "version=${version}" >> "$GITHUB_OUTPUT"
                    echo "### Published \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

            -   name: Publish library
                run: ./gradlew -Pversion=${{ steps.version.outputs.version }} publish -x check
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_USERNAME: ${{ github.actor }}
                    ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                    ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

            -   name: Publish Gradle plugin
                run: ./gradlew :gradle-plugin:publish -Pversion=${{ steps.version.outputs.version }} -x check
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GITHUB_USERNAME: ${{ github.actor }}
                    ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                    ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
