name: Pull Request

on: pull_request

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            packages: write
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5.0.0
                with:
                    java-version: 21
                    distribution: 'temurin'

            -   name: Setup Gradle for a non-wrapper project
                uses: gradle/actions/setup-gradle@v5
                with:
                    gradle-version: wrapper
            -   name: Bygg & test
                run: ./gradlew ktlintCheck test --continue --configuration-cache --stacktrace --info
            -   name: Gradle plugin lint & unit tests
                run: ./gradlew :gradle-plugin:ktlintCheck :gradle-plugin:test :gradle-plugin:validatePlugins --continue --stacktrace
            -   name: Gradle plugin functional tests
                run: |
                    ./gradlew publishAllPublicationsToFunctionalTestRepository -Pversion=0.0.0-SNAPSHOT --stacktrace
                    ./gradlew :gradle-plugin:functionalTest -Pversion=0.0.0-SNAPSHOT --stacktrace
