name: Pull Request

on: pull_request

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    GRADLE_OPTS: "-Dorg.gradle.configuration-cache=true"

jobs:
    # The job id is the "build" status check required by the main branch protection
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@v7
            -   uses: ./.github/actions/build-and-test

    # Dependabot auto-merge is disabled: Dependabot PRs are merged manually for now.
    # To enable it, uncomment the job below and in the repository settings:
    #   - Settings → General → Pull Requests: enable "Allow squash merging" and "Allow auto-merge";
    #   - Settings → Branches → main: require the "build" status check (--auto waits for required checks only;
    #     with "Required approvals" it also waits for your approval).
    # The job auto-merges minor/patch updates only; major updates stay open for manual review.
